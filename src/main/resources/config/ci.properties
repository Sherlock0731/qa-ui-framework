# CI environment configuration

env=ci

# Application URLs
saucedemo.base.url=${SAUCEDEMO_BASE_URL}

# User credentials (same as default.properties)
user.standard.username=${USER_STANDARD_USERNAME}
user.standard.password=${USER_STANDARD_PASSWORD}
user.locked.username=${LOCKED_STANDARD_USERNAME}
user.locked.password=${USER_STANDARD_PASSWORD}
user.problem.username=${PROBLEM_STANDARD_USERNAME}
user.problem.password=${USER_STANDARD_PASSWORD}
user.performance.username=${PERFORMANCE_STANDARD_USERNAME}
user.performance.password=${USER_STANDARD_PASSWORD}

# Checkout information
checkout.firstname=${CHECKOUT_FIRSTNAME}
checkout.lastname=${CHECKOUT_LASTNAME}
checkout.zipcode=${CHECKOUT_ZIPCODE}

# Browser configuration
browser=chrome
browser.headless=true
browser.width=1920
browser.height=1080

# Timeout settings (milliseconds)
timeout.page.load=30000
timeout.implicit=10000
timeout.explicit=10000

# Thread configuration
thread.count=4

# Screenshots and logging
screenshot.on.failure=true
screenshot.folder=target/screenshots
logging.detailed=true

# Retry configuration
retry.attempts=0
