# Default configuration properties

# Environment
env=local

# Application URLs
saucedemo.base.url=

# User credentials
user.standard.username=
user.standard.password=
user.locked.username=
user.locked.password=
user.problem.username=
user.problem.password=
user.performance.username=
user.performance.password=

# Checkout information
checkout.firstname=
checkout.lastname=
checkout.zipcode=

# Browser configuration
browser=chrome
browser.headless=false
browser.width=1920
browser.height=1080
browser.remote.url=

# WebDriver configuration
# Set to true to use local WebDriver binaries instead of WebDriverManager
webdriver.use.local=false

# Local WebDriver paths (only used if webdriver.use.local=true)
# Windows example: C:/drivers/chromedriver.exe
# Linux/Mac example: /usr/local/bin/chromedriver
webdriver.chrome.driver=
webdriver.firefox.driver=
webdriver.edge.driver=

# Timeout settings (milliseconds)
timeout.page.load=30000
timeout.implicit=10000
timeout.explicit=10000

# Thread configuration
thread.count=1

# Screenshots
screenshot.on.failure=true
screenshot.folder=target/screenshots

# Logging
logging.detailed=false

# Retry configuration
retry.attempts=0
